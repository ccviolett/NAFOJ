name: db-matrix

# NAFOJ: run the test suite against all three storage backends.
# mongodb runs on mongodb-memory-server; postgres/sqlite run through the
# FerretDB sidecar built by install/ferretdb/build.sh (cached by version).

on:
  push:
    branches: [master, nafoj]
  pull_request:

permissions:
  contents: read

env:
  CI: true
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'

jobs:
  test:
    name: test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [mongodb, postgres, sqlite]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ferretdb
          POSTGRES_PASSWORD: ferretdb
          POSTGRES_DB: ferretdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferretdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HYDRO_DB_MODE: ${{ matrix.mode }}
      FERRETDB_POSTGRESQL_URL: postgres://ferretdb:ferretdb@127.0.0.1:5432/ferretdb?search_path=hydro
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Go
        if: matrix.mode != 'mongodb'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Cache FerretDB binary
        id: ferretdb-cache
        if: matrix.mode != 'mongodb'
        uses: actions/cache@v4
        with:
          path: ~/.hydro/bin
          key: ferretdb-v1.24.2-${{ runner.os }}
      - name: Build FerretDB
        if: matrix.mode != 'mongodb' && steps.ferretdb-cache.outputs.cache-hit != 'true'
        run: ./install/ferretdb/build.sh
      - name: Install dependencies
        run: |
          yarn set version 4.13.0
          yarn
          node build/prepare.js
      - name: Build
        run: |
          yarn build:ui:iconfont
          yarn build
      - name: Test
        run: yarn test
